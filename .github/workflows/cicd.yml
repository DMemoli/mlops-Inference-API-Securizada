name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  evaluacion_y_despliegue:
    runs-on: ubuntu-24.04

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v5

    - name: Configurar entorno de Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip' 

    - name: Instalar librerías
      run: |
        pip install -r requirements-test.txt
        pip install mlflow httpx # httpx es necesario para TestClient

    
      name: Diagnosticar acceso a Gemini
      env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
          python - <<'PY'
          import os
          from google import genai
          from google.genai.errors import ClientError

          key = os.getenv("GEMINI_API_KEY")
          if not key:
              raise SystemExit("Falta GEMINI_API_KEY")

          client = genai.Client(api_key=key)

          try:
              respuesta = client.models.generate_content(
                  model="gemini-3.5-flash-lite",
                  contents="Responde solamente OK"
              )
              print("Gemini funciona:", respuesta.text)

          except ClientError as e:
              print("Código HTTP:", e.code)
              print("Detalle del error:", e.message)
              raise SystemExit(1)
          PY
  

    - name: Ejecutar Evaluación Semántica y de Seguridad (CI)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python eval.py

    - name: Despliegue a Producción (CD - Render)
      # Este paso SOLO se ejecuta si el script eval.py termina con éxito (exit 0)
      run: |
        echo "🚀 Métricas superadas. Disparando despliegue en Render..."
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
